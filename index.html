<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6d5bd0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Rainee Final Exam Workbook</title>
  <link rel="stylesheet" href="styles.css?v=20261118-4">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">ENGLISH II · FINAL EXAM</p>
        <h1>Rainee 시험대비 웹워크북</h1>
        <p class="header-copy">교재는 원문 읽기, 이 페이지는 구조 분석·직접 적용·서술형·변형 연습.</p>
      </div>
      <button id="resetAll" class="ghost danger" type="button">전체 기록 초기화</button>
    </div>
  </header>

  <nav class="group-nav" aria-label="범위 선택">
    <div class="nav-inner">
      <button class="group-btn active" data-group="textbook">교과서</button>
      <button class="group-btn" data-group="suneung">수특 1~7</button>
      <button class="group-btn" data-group="mock">6월 학평</button>
      <button class="group-btn" data-group="check">종합 체크</button>
    </div>
  </nav>

  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">강 / 지문</div>
      <div id="lessonList" class="lesson-list"></div>
      <div class="source-note">
        <b>자료 원칙</b>
        <span>이 워크북의 원문 발췌는 이 채팅에서 제공된 시험범위 자료만 사용합니다.</span>
      </div>
    </aside>

    <section class="content">
      <div id="lessonRoot"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js?v=20261118-4"></script>
  <script src="app.js?v=20261118-4"></script>
</body>
</html>
